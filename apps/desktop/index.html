<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Lemlio | LaTeX Writing Workspace</title>
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', system-ui, sans-serif;
        transition: opacity 0.3s ease;
      }
      @media (prefers-color-scheme: dark) {
        #loading-screen { background: #1c1c1e; color: #f5f5f7; }
        #loading-spinner { border-color: #3a3a3c; border-top-color: #0a84ff; }
      }
      #loading-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5e5ea;
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      #loading-screen p {
        font-size: 13px;
        color: #6e6e73;
        letter-spacing: -0.01em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="h-full antialiased">
    <div id="loading-screen">
      <div id="loading-spinner"></div>
      <p>Loading Lemlio...</p>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
